<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1300" width="1050" height="1300" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="startGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="decisionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="ioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1050" height="1300" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="525" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#f1f5f9">SRNHS Attendance Monitoring System</text>
  <text x="525" y="63" text-anchor="middle" font-size="13" fill="#64748b">System Flowchart — Main Process Flow</text>
  <line x1="80" y1="74" x2="820" y2="74" stroke="#334155" stroke-width="1.5"/>

  <!-- LEGEND -->
  <rect x="830" y="90" width="190" height="185" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="925" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">LEGEND</text>
  <ellipse cx="710" cy="130" rx="22" ry="14" fill="url(#startGrad)"/>
  <text x="880" y="134" font-size="10" fill="#94a3b8">Start / End</text>
  <rect x="846" y="152" width="28" height="18" rx="3" fill="url(#processGrad)"/>
  <text x="880" y="164" font-size="10" fill="#94a3b8">Process</text>
  <polygon points="850,195 870,183 890,195 870,207" fill="url(#decisionGrad)"/>
  <text x="900" y="198" font-size="10" fill="#94a3b8">Decision</text>
  <polygon points="846,220 874,213 898,220 874,227" fill="url(#ioGrad)"/>
  <text x="905" y="224" font-size="10" fill="#94a3b8">Input / Output</text>
  <rect x="846" y="238" width="28" height="18" rx="14" fill="url(#termGrad)"/>
  <text x="880" y="250" font-size="10" fill="#94a3b8">Terminator</text>

  <!-- ==== START ==== -->
  <ellipse cx="450" cy="118" rx="60" ry="22" fill="url(#startGrad)" filter="url(#shadow)"/>
  <text x="450" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="white">START</text>
  <line x1="450" y1="140" x2="450" y2="168" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- P1: Open Web App -->
  <rect x="330" y="170" width="240" height="44" rx="6" fill="url(#processGrad)" filter="url(#shadow)"/>
  <text x="450" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="white">Open SRNHS Web App</text>
  <line x1="450" y1="214" x2="450" y2="242" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- D1: Has Session? -->
  <polygon points="450,244 570,268 450,292 330,268" fill="url(#decisionGrad)" filter="url(#shadow)"/>
  <text x="450" y="265" text-anchor="middle" font-size="11" font-weight="600" fill="white">Valid Session?</text>
  <text x="578" y="271" font-size="10" fill="#fcd34d">YES</text>
  <text x="390" y="300" font-size="10" fill="#fcd34d">NO</text>
  <!-- Yes branch -->
  <line x1="570" y1="268" x2="670" y2="268" stroke="#fbbf24" stroke-width="2"/>
  <line x1="670" y1="268" x2="670" y2="418" stroke="#fbbf24" stroke-width="2"/>
  <!-- No branch -->
  <line x1="450" y1="292" x2="450" y2="322" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- IO: Login Form -->
  <polygon points="330,324 570,324 550,368 310,368" fill="url(#ioGrad)" filter="url(#shadow)"/>
  <text x="440" y="345" text-anchor="middle" font-size="12" font-weight="600" fill="white">Enter Credentials</text>
  <text x="440" y="360" text-anchor="middle" font-size="10" fill="#d1fae5">(Email + Password)</text>
  <line x1="440" y1="368" x2="440" y2="396" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- D2: Valid Creds? -->
  <polygon points="440,398 560,422 440,446 320,422" fill="url(#decisionGrad)" filter="url(#shadow)"/>
  <text x="440" y="419" text-anchor="middle" font-size="11" font-weight="600" fill="white">Valid Credentials?</text>
  <text x="568" y="425" font-size="10" fill="#fcd34d">YES</text>
  <text x="270" y="425" font-size="10" fill="#ef4444">NO</text>
  <!-- No branch back to login -->
  <line x1="320" y1="422" x2="240" y2="422" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="240" y1="422" x2="240" y2="346" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="240" y1="346" x2="310" y2="346" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="208" y="388" text-anchor="middle" font-size="9" fill="#f87171">Retry</text>
  <!-- Yes branch -->
  <line x1="560" y1="422" x2="670" y2="422" stroke="#fbbf24" stroke-width="2"/>
  <line x1="670" y1="418" x2="670" y2="458" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- P2: Load Dashboard -->
  <rect x="560" y="460" width="220" height="44" rx="6" fill="url(#processGrad)" filter="url(#shadow)"/>
  <text x="670" y="486" text-anchor="middle" font-size="12" font-weight="600" fill="white">Load Dashboard</text>
  <line x1="670" y1="504" x2="670" y2="534" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- D3: User Role? -->
  <polygon points="670,536 790,560 670,584 550,560" fill="url(#decisionGrad)" filter="url(#shadow)"/>
  <text x="670" y="557" text-anchor="middle" font-size="11" font-weight="600" fill="white">User Role?</text>
  <!-- Admin label -->
  <text x="800" y="563" font-size="10" fill="#fcd34d">Admin</text>
  <!-- Teacher label -->
  <text x="575" y="595" font-size="10" fill="#fcd34d">Teacher</text>
  <line x1="790" y1="560" x2="850" y2="560" stroke="#fbbf24" stroke-width="2"/>
  <line x1="850" y1="560" x2="850" y2="620" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="584" x2="670" y2="620" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- P3 Admin Panel -->
  <rect x="760" y="622" width="180" height="44" rx="6" fill="#7c3aed" filter="url(#shadow)"/>
  <text x="850" y="642" text-anchor="middle" font-size="11" font-weight="700" fill="white">Admin Panel</text>
  <text x="850" y="657" text-anchor="middle" font-size="9" fill="#ddd6fe">Gate Log, SMS, Academics</text>

  <!-- P3 Teacher Panel -->
  <rect x="560" y="622" width="180" height="44" rx="6" fill="#0891b2" filter="url(#shadow)"/>
  <text x="650" y="642" text-anchor="middle" font-size="11" font-weight="700" fill="white">Teacher Panel</text>
  <text x="650" y="657" text-anchor="middle" font-size="9" fill="#cffafe">Sections, Attendance</text>

  <!-- Merge -->
  <line x1="850" y1="666" x2="850" y2="700" stroke="#60a5fa" stroke-width="2"/>
  <line x1="650" y1="666" x2="650" y2="700" stroke="#60a5fa" stroke-width="2"/>
  <line x1="650" y1="700" x2="850" y2="700" stroke="#60a5fa" stroke-width="2"/>
  <line x1="750" y1="700" x2="750" y2="730" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- D4: Choose Action -->
  <polygon points="750,732 870,756 750,780 630,756" fill="url(#decisionGrad)" filter="url(#shadow)"/>
  <text x="750" y="753" text-anchor="middle" font-size="11" font-weight="600" fill="white">Select Action</text>

  <!-- Actions -->
  <!-- Gate Log Action (Right Col: center 840, w=140 -> x=770..910) -->
  <line x1="870" y1="756" x2="840" y2="756" stroke="#fbbf24" stroke-width="2"/>
  <line x1="840" y1="756" x2="840" y2="800" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="770" y="802" width="140" height="40" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="840" y="817" text-anchor="middle" font-size="10" font-weight="600" fill="#93c5fd">View Gate Log</text>
  <text x="840" y="830" text-anchor="middle" font-size="9" fill="#64748b">Face Recognition Events</text>

  <!-- Classroom Attendance Action (Mid Col: center 660, w=150 -> x=585..735) -->
  <line x1="750" y1="780" x2="660" y2="780" stroke="#fbbf24" stroke-width="2"/>
  <line x1="660" y1="780" x2="660" y2="800" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="585" y="802" width="150" height="40" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="660" y="817" text-anchor="middle" font-size="10" font-weight="600" fill="#93c5fd">Classroom Attendance</text>
  <text x="660" y="830" text-anchor="middle" font-size="9" fill="#64748b">Mark Present / Absent</text>

  <!-- Manage Students Action (Left Col: center 480, w=140 -> x=410..550) -->
  <line x1="630" y1="756" x2="480" y2="756" stroke="#fbbf24" stroke-width="2"/>
  <line x1="480" y1="756" x2="480" y2="800" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="410" y="802" width="140" height="40" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="817" text-anchor="middle" font-size="10" font-weight="600" fill="#93c5fd">Manage Students</text>
  <text x="480" y="830" text-anchor="middle" font-size="9" fill="#64748b">CRUD + Face Enroll</text>

  <!-- Face Registration Sub-flow (Left Col: center 480, w=140 -> x=410..550) -->
  <line x1="480" y1="842" x2="480" y2="880" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="410" y="882" width="140" height="44" rx="6" fill="url(#processGrad)" filter="url(#shadow)"/>
  <text x="480" y="900" text-anchor="middle" font-size="11" font-weight="600" fill="white">Face Registration</text>
  <text x="480" y="916" text-anchor="middle" font-size="9" fill="#dbeafe">Capture + Upload Photos</text>

  <!-- SMS Sub-flow (Mid Col: center 660, w=150 -> x=585..735) -->
  <line x1="660" y1="842" x2="660" y2="880" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="585" y="882" width="150" height="44" rx="6" fill="url(#processGrad)" filter="url(#shadow)"/>
  <text x="660" y="900" text-anchor="middle" font-size="11" font-weight="600" fill="white">Generate SMS Alert</text>
  <text x="660" y="916" text-anchor="middle" font-size="9" fill="#dbeafe">Send to Guardian Phone</text>

  <!-- Gate Log Sub-flow (Right Col: center 840, w=140 -> x=770..910) -->
  <line x1="840" y1="842" x2="840" y2="880" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="770" y="882" width="140" height="44" rx="6" fill="url(#processGrad)" filter="url(#shadow)"/>
  <text x="840" y="900" text-anchor="middle" font-size="11" font-weight="600" fill="white">Log Entry / Exit</text>
  <text x="840" y="916" text-anchor="middle" font-size="9" fill="#dbeafe">Record to Supabase DB</text>

  <!-- Merge all sub-flows -->
  <line x1="480" y1="926" x2="480" y2="960" stroke="#60a5fa" stroke-width="2"/>
  <line x1="660" y1="926" x2="660" y2="960" stroke="#60a5fa" stroke-width="2"/>
  <line x1="840" y1="926" x2="840" y2="960" stroke="#60a5fa" stroke-width="2"/>
  <line x1="480" y1="960" x2="840" y2="960" stroke="#60a5fa" stroke-width="2"/>
  <line x1="660" y1="960" x2="660" y2="990" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- D5: Continue? -->
  <polygon points="660,992 780,1016 660,1040 540,1016" fill="url(#decisionGrad)" filter="url(#shadow)"/>
  <text x="660" y="1013" text-anchor="middle" font-size="11" font-weight="600" fill="white">Continue Session?</text>
  <text x="788" y="1019" font-size="10" fill="#fcd34d">YES</text>
  <text x="570" y="1049" font-size="10" fill="#ef4444">NO / Logout</text>

  <!-- YES - loop back -->
  <line x1="780" y1="1016" x2="960" y2="1016" stroke="#fbbf24" stroke-width="2"/>
  <line x1="960" y1="1016" x2="960" y2="756" stroke="#fbbf24" stroke-width="2"/>
  <line x1="960" y1="756" x2="870" y2="756" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="972" y="880" text-anchor="middle" font-size="9" fill="#fcd34d" transform="rotate(90,910,880)">Back to Menu</text>

  <!-- NO - Logout -->
  <line x1="660" y1="1040" x2="660" y2="1070" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- P: Clear Session -->
  <rect x="560" y="1072" width="200" height="44" rx="6" fill="#7f1d1d" filter="url(#shadow)"/>
  <text x="660" y="1090" text-anchor="middle" font-size="12" font-weight="600" fill="white">Clear Session</text>
  <text x="660" y="1106" text-anchor="middle" font-size="10" fill="#fca5a5">Destroy JWT / Logout</text>
  <line x1="660" y1="1116" x2="660" y2="1146" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- END -->
  <ellipse cx="660" cy="1168" rx="60" ry="22" fill="url(#termGrad)" filter="url(#shadow)"/>
  <text x="660" y="1172" text-anchor="middle" font-size="12" font-weight="700" fill="white">END</text>

  <!-- Supabase DB note -->
  <rect x="30" y="700" width="190" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="125" y="722" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">⚡ Supabase Backend</text>
  <text x="125" y="742" text-anchor="middle" font-size="10" fill="#475569">All operations persist</text>
  <text x="125" y="757" text-anchor="middle" font-size="10" fill="#475569">to PostgreSQL via</text>
  <text x="125" y="772" text-anchor="middle" font-size="10" fill="#475569">Supabase Realtime</text>
  <text x="125" y="788" text-anchor="middle" font-size="10" fill="#475569">with RLS Policies</text>
  <line x1="220" y1="750" x2="510" y2="820" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
