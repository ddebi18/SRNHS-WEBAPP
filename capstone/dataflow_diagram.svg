<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 960" width="1520" height="960" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Central Process 0.0 Gradient (Vibrant Blue/Indigo) -->
    <linearGradient id="proc0Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Entity Gradients -->
    <linearGradient id="entityGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#58310c"/>
    </linearGradient>
    <linearGradient id="entityPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="entityRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#700926"/>
    </linearGradient>
    <linearGradient id="entityEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#043a2b"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrCyan" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#34d399"/>
    </marker>
    <marker id="arrAmber" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#fbbf24"/>
    </marker>
    <marker id="arrPurple" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#c084fc"/>
    </marker>
    <marker id="arrRose" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="1520" height="960" fill="url(#bgGrad)"/>
  <!-- Header Title -->
  <g transform="translate(760, 42)">
    <text text-anchor="middle" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="0.5">DATA FLOW DIAGRAM (DFD) — CONTEXT LEVEL (LEVEL 0)</text>
    <text y="24" text-anchor="middle" font-size="13" font-weight="500" fill="#94a3b8">SRNHS Student Attendance Monitoring System with Python &amp; Webcam Integration</text>
  </g>
  <line x1="60" y1="78" x2="1460" y2="78" stroke="#334155" stroke-width="1.5"/>
  <!-- ================= CENTRAL PROCESS 0.0 ================= -->
  <g filter="url(#shadow)">
    <!-- Outer Glow / Ring -->
    <rect x="546" y="216" width="428" height="268" rx="20" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    <rect x="550" y="220" width="420" height="260" rx="16" fill="url(#proc0Grad)" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Top Process Number Banner -->
    <rect x="566" y="236" width="388" height="38" rx="8" fill="#1d4ed8"/>
    <circle cx="592" cy="255" r="14" fill="#1e40af"/>
    <text x="592" y="260" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">0.0</text>
    <text x="618" y="253" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">CENTRAL SYSTEM PROCESS</text>
    <text x="618" y="266" font-size="9.5" fill="#bfdbfe">Context Boundary Representation</text>

    <!-- Main Title -->
    <text x="760" y="304" text-anchor="middle" font-size="14.5" font-weight="800" fill="#f8fafc">STUDENT ATTENDANCE MONITORING SYSTEM</text>
    <text x="760" y="323" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">USING FACIAL RECOGNITION TECHNOLOGY</text>
    <text x="760" y="340" text-anchor="middle" font-size="10" font-weight="500" fill="#94a3b8">San Roque National High School (SRNHS)</text>
    <line x1="574" y1="350" x2="946" y2="350" stroke="#334155" stroke-width="1"/>

    <!-- Inner Modules Bullet List -->
    <text x="578" y="372" font-size="10" fill="#cbd5e1">• Facial Biometric Verification &amp; Edge Inference</text>
    <text x="578" y="392" font-size="10" fill="#cbd5e1">• Automated Gate Entry / Exit Attendance Logging</text>
    <text x="578" y="412" font-size="10" fill="#cbd5e1">• Real-time WebSockets Dashboard &amp; Analytics</text>
    <text x="578" y="432" font-size="10" fill="#cbd5e1">• Immediate Guardian Cellular SMS Dispatch</text>
    <text x="578" y="452" font-size="10" fill="#cbd5e1">• Academic Sections &amp; DepEd SF2 Compliance</text>
  </g>
  <!-- E1: Student / Attendee -->
  <g filter="url(#shadow)">
    <rect x="60" y="120" width="270" height="135" rx="10" fill="url(#entityGold)" stroke="#eab308" stroke-width="1.5"/>
    <rect x="74" y="132" width="42" height="22" rx="4" fill="#a16207"/>
    <text x="95" y="147" text-anchor="middle" font-size="11" font-weight="800" fill="#fef08a">E1</text>
    <text x="124" y="148" font-size="12.5" font-weight="700" fill="#ffffff">Student / Attendee</text>
    <line x1="74" y1="162" x2="316" y2="162" stroke="#ca8a04" stroke-width="1"/>
    <text x="76" y="182" font-size="10" fill="#fef9c3">• Physical subject for attendance</text>
    <text x="76" y="200" font-size="10" fill="#fef9c3">• Presents face before webcam sensor</text>
    <text x="76" y="218" font-size="10" fill="#fef9c3">• Receives immediate on-screen prompt</text>
    <text x="76" y="236" font-size="10" fill="#fef9c3">• Verifies Time-In / Time-Out audio chime</text>
  </g>
  <!-- E2: Webcam & Python Vision Subsystem -->
  <g filter="url(#shadow)">
    <rect x="60" y="440" width="270" height="160" rx="10" fill="url(#entityPurple)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="74" y="452" width="42" height="22" rx="4" fill="#7e22ce"/>
    <text x="95" y="467" text-anchor="middle" font-size="11" font-weight="800" fill="#f3e8ff">E2</text>
    <text x="124" y="468" font-size="12" font-weight="700" fill="#ffffff">Webcam &amp; Python CV</text>
    <line x1="74" y1="482" x2="316" y2="482" stroke="#9333ea" stroke-width="1"/>
    <text x="76" y="502" font-size="10" font-weight="600" fill="#e9d5ff">Hardware &amp; Local Edge Agent:</text>
    <text x="76" y="520" font-size="9.5" fill="#f3e8ff">• HD 1080p Optical Frame Stream</text>
    <text x="76" y="538" font-size="9.5" fill="#f3e8ff">• OpenCV 4.x Video Preprocessing</text>
    <text x="76" y="556" font-size="9.5" fill="#f3e8ff">• FaceNet 128D Embedding Generator</text>
    <text x="76" y="574" font-size="9.5" fill="#f3e8ff">• Cosine Similarity Vector Matching</text>
    <text x="76" y="588" font-size="9" fill="#c084fc">Sub-1.2s Edge Verification Pipeline</text>
  </g>
  <!-- E3: School Administrator & Teachers -->
  <g filter="url(#shadow)">
    <rect x="1190" y="120" width="270" height="150" rx="10" fill="url(#entityEmerald)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="1204" y="132" width="42" height="22" rx="4" fill="#047857"/>
    <text x="1225" y="147" text-anchor="middle" font-size="11" font-weight="800" fill="#a7f3d0">E3</text>
    <text x="1254" y="148" font-size="12" font-weight="700" fill="#ffffff">Admin &amp; Teachers</text>
    <line x1="1204" y1="162" x2="1446" y2="162" stroke="#059669" stroke-width="1"/>
    <text x="1206" y="182" font-size="10" fill="#d1fae5">• School Principal &amp; Academic Staff</text>
    <text x="1206" y="200" font-size="10" fill="#d1fae5">• Section Advisers &amp; Subject Teachers</text>
    <text x="1206" y="218" font-size="10" fill="#d1fae5">• Manages student profiles &amp; photos</text>
    <text x="1206" y="236" font-size="10" fill="#d1fae5">• Monitors real-time gate log stream</text>
    <text x="1206" y="254" font-size="10" fill="#d1fae5">• Exports DepEd School Form 2 (SF2)</text>
  </g>
  <!-- E4: Cloud SMS Gateway -->
  <g filter="url(#shadow)">
    <rect x="1190" y="440" width="270" height="135" rx="10" fill="url(#entityRose)" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="1204" y="452" width="42" height="22" rx="4" fill="#be123c"/>
    <text x="1225" y="467" text-anchor="middle" font-size="11" font-weight="800" fill="#fecdd3">E4</text>
    <text x="1254" y="468" font-size="12" font-weight="700" fill="#ffffff">Cloud SMS Gateway</text>
    <line x1="1204" y1="482" x2="1446" y2="482" stroke="#e11d48" stroke-width="1"/>
    <text x="1206" y="502" font-size="10" fill="#ffe4e6">• PhilSMS / Semaphore / Twilio API</text>
    <text x="1206" y="520" font-size="10" fill="#ffe4e6">• Secure HTTPS REST Gateway</text>
    <text x="1206" y="538" font-size="10" fill="#ffe4e6">• Dispatches GSM cellular traffic</text>
    <text x="1206" y="556" font-size="10" fill="#ffe4e6">• Returns telco delivery receipts</text>
  </g>
  <!-- E5: Parent / Guardian -->
  <g filter="url(#shadow)">
    <rect x="610" y="590" width="300" height="130" rx="10" fill="url(#entityGold)" stroke="#eab308" stroke-width="1.5"/>
    <rect x="624" y="602" width="42" height="22" rx="4" fill="#a16207"/>
    <text x="645" y="617" text-anchor="middle" font-size="11" font-weight="800" fill="#fef08a">E5</text>
    <text x="674" y="618" font-size="12.5" font-weight="700" fill="#ffffff">Parent / Guardian</text>
    <line x1="624" y1="632" x2="896" y2="632" stroke="#ca8a04" stroke-width="1"/>
    <text x="626" y="652" font-size="10" fill="#fef9c3">• Registered guardian contact recipient</text>
    <text x="626" y="670" font-size="10" fill="#fef9c3">• Receives instant SMS arrival / departure text</text>
    <text x="626" y="686" font-size="9" fill="#fda4af">  "SRNHS Alert: Student arrived at 07:15 AM"</text>
    <text x="626" y="704" font-size="10" fill="#fef9c3">• Works on all standard GSM cellular phones</text>
  </g>
  <!-- ================= LEVEL 0 DATA FLOW CONNECTORS ================= -->
  <!-- Flow 1A: Student to System -->
  <path d="M 330 160 L 440 160 L 440 250 L 550 250" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrCyan)"/>
  <rect x="345" y="148" width="170" height="24" rx="4" fill="#0f172a" stroke="#ca8a04" stroke-width="0.8"/>
  <text x="430" y="164" text-anchor="middle" font-size="9" font-weight="600" fill="#fef08a">Presents Face at Camera Gate</text>
  <!-- Flow 1B: System to Student -->
  <path d="M 550 290 L 440 290 L 440 200 L 330 200" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrAmber)"/>
  <rect x="340" y="278" width="180" height="24" rx="4" fill="#0f172a" stroke="#059669" stroke-width="0.8"/>
  <text x="430" y="294" text-anchor="middle" font-size="9" font-weight="600" fill="#6ee7b7">Visual Green Status &amp; Audio Chime</text>
  <!-- Flow 2A: Webcam & Python to System -->
  <path d="M 330 480 L 440 480 L 440 370 L 550 370" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrCyan)"/>
  <rect x="340" y="468" width="180" height="24" rx="4" fill="#0f172a" stroke="#9333ea" stroke-width="0.8"/>
  <text x="430" y="484" text-anchor="middle" font-size="9" font-weight="600" fill="#d8b4fe">128D Vector &amp; Match Record</text>
  <!-- Flow 2B: System to Webcam/Python -->
  <path d="M 550 420 L 440 420 L 440 530 L 330 530" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrPurple)"/>
  <rect x="340" y="518" width="180" height="24" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="0.8"/>
  <text x="430" y="534" text-anchor="middle" font-size="9" font-weight="600" fill="#7dd3fc">Enrolled Face Templates &amp; Rules</text>
  <!-- Flow 3A: Staff to System -->
  <path d="M 1190 160 L 1080 160 L 1080 250 L 970 250" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrCyan)"/>
  <rect x="995" y="148" width="170" height="24" rx="4" fill="#0f172a" stroke="#059669" stroke-width="0.8"/>
  <text x="1080" y="164" text-anchor="middle" font-size="9" font-weight="600" fill="#6ee7b7">Credentials &amp; Student Profiles</text>
  <!-- Flow 3B: System to Staff -->
  <path d="M 970 290 L 1080 290 L 1080 200 L 1190 200" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrGreen)"/>
  <rect x="990" y="278" width="180" height="24" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="0.8"/>
  <text x="1080" y="294" text-anchor="middle" font-size="9" font-weight="600" fill="#7dd3fc">Live Gate Logs &amp; DepEd SF2 Export</text>
  <!-- Flow 4A: System to SMS Gateway -->
  <path d="M 970 370 L 1080 370 L 1080 480 L 1190 480" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrRose)"/>
  <rect x="990" y="468" width="180" height="24" rx="4" fill="#0f172a" stroke="#e11d48" stroke-width="0.8"/>
  <text x="1080" y="484" text-anchor="middle" font-size="9" font-weight="600" fill="#fecdd3">SMS Dispatch Payload (REST API)</text>
  <!-- Flow 4B: SMS Gateway to System -->
  <path d="M 1190 530 L 1080 530 L 1080 420 L 970 420" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrCyan)"/>
  <rect x="995" y="518" width="170" height="24" rx="4" fill="#0f172a" stroke="#be123c" stroke-width="0.8"/>
  <text x="1080" y="534" text-anchor="middle" font-size="9" font-weight="600" fill="#fda4af">Delivery Confirmation Receipts</text>
  <!-- Flow 5A: SMS Gateway to Guardian Mobile -->
  <path d="M 1325 575 L 1325 650 L 910 650" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrAmber)"/>
  <rect x="940" y="638" width="180" height="24" rx="4" fill="#0f172a" stroke="#e11d48" stroke-width="0.8"/>
  <text x="1030" y="654" text-anchor="middle" font-size="9" font-weight="600" fill="#fecdd3">Nationwide GSM Cellular Alert</text>
  <!-- Flow 5B: System to Guardian direct flow -->
  <line x1="760" y1="480" x2="760" y2="590" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrAmber)"/>
  <rect x="670" y="525" width="180" height="24" rx="4" fill="#0f172a" stroke="#ca8a04" stroke-width="0.8"/>
  <text x="760" y="541" text-anchor="middle" font-size="9" font-weight="600" fill="#fef08a">Student Attendance Notice</text>
  <!-- ================= FOOTER: CONTEXT DFD RULES & SUMMARY ================= -->
  <g filter="url(#shadow)">
    <rect x="60" y="760" width="1400" height="165" rx="10" fill="#0b1329" stroke="#334155" stroke-width="1.2"/>
    <rect x="80" y="772" width="250" height="24" rx="4" fill="#1e293b"/>
    <text x="205" y="788" text-anchor="middle" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="0.5">CONTEXT DIAGRAM (LEVEL 0) RULES</text>

    <!-- Block 1: The Level 0 System Boundary -->
    <g transform="translate(80, 806)">
      <rect width="320" height="102" rx="6" fill="#0f1f38" stroke="#1d4ed8" stroke-width="1"/>
      <text x="14" y="20" font-size="11" font-weight="700" fill="#93c5fd">Central System Boundary (0.0)</text>
      <text x="14" y="38" font-size="9.5" fill="#94a3b8">• Represents the entire software-hardware system</text>
      <text x="14" y="54" font-size="9.5" fill="#94a3b8">• Encompasses Web App, BaaS &amp; AI Vision Engine</text>
      <text x="14" y="70" font-size="9.5" fill="#94a3b8">• Internal data stores are encapsulated inside 0.0</text>
      <text x="14" y="86" font-size="9.5" fill="#94a3b8">• Focuses strictly on net input/output boundaries</text>
    </g>

    <!-- Block 2: External Entities -->
    <g transform="translate(425, 806)">
      <rect width="320" height="102" rx="6" fill="#1f1807" stroke="#ca8a04" stroke-width="1"/>
      <text x="14" y="20" font-size="11" font-weight="700" fill="#fde047">External Entities (Terminators)</text>
      <text x="14" y="38" font-size="9.5" fill="#94a3b8">• People, devices, or systems outside project boundary</text>
      <text x="14" y="54" font-size="9.5" fill="#94a3b8">• E1 (Student): Primary biometric subject</text>
      <text x="14" y="70" font-size="9.5" fill="#94a3b8">• E2 (Webcam &amp; Python): Physical sensor &amp; vision agent</text>
      <text x="14" y="86" font-size="9.5" fill="#94a3b8">• E3 (Staff), E4 (SMS Gateway), E5 (Guardian)</text>
    </g>

    <!-- Block 3: Python & Webcam Edge Integration -->
    <g transform="translate(770, 806)">
      <rect width="320" height="102" rx="6" fill="#1b0e2b" stroke="#9333ea" stroke-width="1"/>
      <text x="14" y="20" font-size="11" font-weight="700" fill="#d8b4fe">Edge AI &amp; Python Specification</text>
      <text x="14" y="38" font-size="9.5" fill="#94a3b8">• Camera: USB 1080p Optical Webcam (30 FPS)</text>
      <text x="14" y="54" font-size="9.5" fill="#94a3b8">• Computer Vision: OpenCV 4.x Video Capture</text>
      <text x="14" y="70" font-size="9.5" fill="#94a3b8">• Biometric Model: FaceNet 128D Deep Embeddings</text>
      <text x="14" y="86" font-size="9.5" fill="#94a3b8">• Response Latency: &lt; 1.2s inference per student</text>
    </g>

    <!-- Block 4: Telecommunications & Data Flows -->
    <g transform="translate(1115, 806)">
      <rect width="285" height="102" rx="6" fill="#290d15" stroke="#be123c" stroke-width="1"/>
      <text x="14" y="20" font-size="11" font-weight="700" fill="#fda4af">Notification &amp; Security Protocols</text>
      <text x="14" y="38" font-size="9.5" fill="#94a3b8">• Data Security: TLS 1.3 / HTTPS Encryption</text>
      <text x="14" y="54" font-size="9.5" fill="#94a3b8">• Regulatory: Compliant with RA 10173 (DPA)</text>
      <text x="14" y="70" font-size="9.5" fill="#94a3b8">• SMS Transit: Semaphore / PhilSMS Cloud Gateway</text>
      <text x="14" y="86" font-size="9.5" fill="#94a3b8">• Real-time Sync: Supabase WebSocket Channels</text>
    </g>
  </g>
</svg>