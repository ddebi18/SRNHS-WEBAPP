  <line x1="665" y1="376" x2="665" y2="416" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="590" y="418" width="150" height="44" rx="6" fill="url(#leafGrad)" filter="url(#shadow)"/>
  <text x="665" y="436" text-anchor="middle" font-size="10" font-weight="600" fill="white">Staff Profiles</text>
  <text x="665" y="450" text-anchor="middle" font-size="9" fill="#99f6e4">View Assignments</text>

  <!-- Academics children -->
  <line x1="855" y1="376" x2="855" y2="416" stroke="#475569" stroke-width="1.5"/>
  <line x1="815" y1="416" x2="895" y2="416" stroke="#475569" stroke-width="1.5"/>
  <line x1="815" y1="416" x2="815" y2="446" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="895" y1="416" x2="895" y2="446" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="770" y="448" width="75" height="40" rx="6" fill="url(#leafGrad)" filter="url(#shadow)"/>
  <text x="807" y="463" text-anchor="middle" font-size="8.5" font-weight="600" fill="white">Sections</text>
  <text x="807" y="477" text-anchor="middle" font-size="7.5" fill="#99f6e4">Grades 7-12</text>
  <rect x="855" y="448" width="75" height="40" rx="6" fill="url(#leafGrad)" filter="url(#shadow)"/>
  <text x="892" y="463" text-anchor="middle" font-size="8.5" font-weight="600" fill="white">Subjects</text>
  <text x="892" y="477" text-anchor="middle" font-size="7.5" fill="#99f6e4">Schedules</text>

  <!-- SMS Log children -->
  <line x1="1045" y1="376" x2="1045" y2="416" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="970" y="418" width="150" height="44" rx="6" fill="url(#leafGrad)" filter="url(#shadow)"/>
  <text x="1045" y="436" text-anchor="middle" font-size="10" font-weight="600" fill="white">SMS History</text>
  <text x="1045" y="450" text-anchor="middle" font-size="9" fill="#99f6e4">Sent / Failed / Queued</text>

  <!-- Face Registration children -->
  <line x1="1235" y1="376" x2="1235" y2="416" stroke="#475569" stroke-width="1.5"/>
  <line x1="1195" y1="416" x2="1275" y2="416" stroke="#475569" stroke-width="1.5"/>
  <line x1="1195" y1="416" x2="1195" y2="446" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1275" y1="416" x2="1275" y2="446" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1155" y="448" width="80" height="40" rx="6" fill="url(#leafGrad)" filter="url(#shadow)"/>
  <text x="1195" y="463" text-anchor="middle" font-size="8.5" font-weight="600" fill="white">Bulk Enroll</text>
  <text x="1195" y="477" text-anchor="middle" font-size="7.5" fill="#99f6e4">/face-reg</text>
  <rect x="1245" y="448" width="75" height="40" rx="6" fill="url(#leafGrad)" filter="url(#shadow)"/>
  <text x="1282" y="463" text-anchor="middle" font-size="8.5" font-weight="600" fill="white">By Section</text>
  <text x="1282" y="477" text-anchor="middle" font-size="7.5" fill="#99f6e4">/sections/:id</text>

  <!-- Utility / Error Pages -->
  <line x1="690" y1="530" x2="690" y2="570" stroke="#475569" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="690" y="560" text-anchor="middle" font-size="10" fill="#475569">Error / Utility Pages</text>
  <line x1="200" y1="575" x2="1180" y2="575" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="275" y1="575" x2="275" y2="600" stroke="#334155" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="535" y1="575" x2="535" y2="600" stroke="#334155" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="795" y1="575" x2="795" y2="600" stroke="#334155" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="1055" y1="575" x2="1055" y2="600" stroke="#334155" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="270" y="602" width="160" height="42" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="350" y="619" text-anchor="middle" font-size="10" font-weight="600" fill="#f87171">⛔ Forbidden Page</text>
  <text x="350" y="633" text-anchor="middle" font-size="9" fill="#64748b">/forbidden (403)</text>
  <rect x="470" y="602" width="160" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="550" y="619" text-anchor="middle" font-size="10" font-weight="600" fill="#fbbf24">🔒 Login Required</text>
  <text x="550" y="633" text-anchor="middle" font-size="9" fill="#64748b">Redirect → /login</text>
  <rect x="670" y="602" width="160" height="42" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="750" y="619" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8">❓ Not Found Page</text>
  <text x="750" y="633" text-anchor="middle" font-size="9" fill="#64748b">/* (404)</text>

  <!-- LEGEND -->
  <rect x="30" y="680" width="340" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="200" y="700" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">ACCESS LEGEND</text>
  <rect x="50" y="712" width="16" height="16" rx="3" fill="url(#adminGrad)"/>
  <text x="75" y="724" font-size="10" fill="#94a3b8">Admin Only Route</text>
  <rect x="200" y="712" width="16" height="16" rx="3" fill="url(#l2Grad)"/>
  <text x="225" y="724" font-size="10" fill="#94a3b8">Admin + Teacher Route</text>
  <rect x="50" y="738" width="16" height="16" rx="3" fill="url(#leafGrad)"/>
  <text x="75" y="750" font-size="10" fill="#94a3b8">Sub-page / Feature View</text>
  <rect x="200" y="738" width="16" height="16" rx="3" fill="url(#rootGrad)"/>
  <text x="225" y="750" font-size="10" fill="#94a3b8">Root / Entry Point</text>
  <text x="200" y="778" text-anchor="middle" font-size="9" fill="#475569">All routes protected by Supabase Auth + RLS except /login</text>
</svg>
