<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="l1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="l2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e"/>
      <stop offset="100%" style="stop-color:#134e4a"/>
    </linearGradient>
    <linearGradient id="adminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1380" height="820" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="690" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#f1f5f9">SRNHS Student Attendance Monitoring System</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#64748b">Site Map — Application Navigation Structure</text>
  <line x1="80" y1="73" x2="1020" y2="73" stroke="#334155" stroke-width="1.5"/>

  <!-- ROOT -->
  <rect x="430" y="95" width="240" height="50" rx="10" fill="url(#rootGrad)" filter="url(#shadow)"/>
  <text x="550" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="white">🏠 SRNHS Web App</text>
  <text x="550" y="134" text-anchor="middle" font-size="10" fill="#c7d2fe">srnhs.app / (root)</text>

  <!-- Login Page (Left of root) -->
  <rect x="60" y="95" width="180" height="50" rx="8" fill="url(#l1Grad)" filter="url(#shadow)"/>
  <text x="150" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="white">🔐 Login Page</text>
  <text x="150" y="134" text-anchor="middle" font-size="10" fill="#dbeafe">/login</text>
  <line x1="240" y1="120" x2="430" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Connected from root downwards -->
  <line x1="550" y1="145" x2="550" y2="185" stroke="#475569" stroke-width="1.5"/>

  <!-- Level 1: Main Navigation Hub (Dashboard) -->
  <rect x="390" y="187" width="320" height="50" rx="8" fill="url(#l1Grad)" filter="url(#shadow)"/>
  <text x="550" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="white">📊 Dashboard Overview</text>
  <text x="550" y="225" text-anchor="middle" font-size="10" fill="#dbeafe">/ — Protected (admin, teacher)</text>

  <!-- Horizontal branch line -->
  <line x1="550" y1="237" x2="550" y2="290" stroke="#475569" stroke-width="1.5"/>
  <line x1="95" y1="290" x2="1235" y2="290" stroke="#475569" stroke-width="1.5"/>

  <!-- Branch verticals -->
  <line x1="100" y1="290" x2="100" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="290" x2="250" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="290" x2="400" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="290" x2="550" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="290" x2="700" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="850" y1="290" x2="850" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1000" y1="290" x2="1000" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Gate Log (Admin only) -->
  <rect x="20" y="322" width="150" height="54" rx="8" fill="url(#adminGrad)" filter="url(#shadow)"/>
  <text x="95" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="white">🚪 Gate Log</text>
  <text x="100" y="360" text-anchor="middle" font-size="9" fill="#ddd6fe">/gate-log</text>
  <text x="95" y="372" text-anchor="middle" font-size="9" fill="#a78bfa">Admin Only</text>

  <!-- Classroom Attendance -->
  <rect x="210" y="322" width="150" height="54" rx="8" fill="url(#l2Grad)" filter="url(#shadow)"/>
  <text x="285" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="white">📋 Classroom</text>
  <text x="285" y="358" text-anchor="middle" font-size="9" fill="#cffafe">Attendance</text>
  <text x="285" y="372" text-anchor="middle" font-size="9" fill="#cffafe">/classroom</text>

  <!-- Students -->
  <rect x="400" y="322" width="150" height="54" rx="8" fill="url(#l2Grad)" filter="url(#shadow)"/>
  <text x="475" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="white">👥 Students</text>
  <text x="475" y="360" text-anchor="middle" font-size="9" fill="#cffafe">/students</text>
  <text x="475" y="372" text-anchor="middle" font-size="9" fill="#cffafe">Admin + Teacher</text>

  <!-- Faculty -->
  <rect x="590" y="322" width="150" height="54" rx="8" fill="url(#l2Grad)" filter="url(#shadow)"/>
  <text x="665" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="white">👤 Faculty</text>
  <text x="665" y="360" text-anchor="middle" font-size="9" fill="#cffafe">/faculty</text>
  <text x="665" y="372" text-anchor="middle" font-size="9" fill="#cffafe">Admin + Teacher</text>

  <!-- Academics (Admin only) -->
  <rect x="780" y="322" width="150" height="54" rx="8" fill="url(#adminGrad)" filter="url(#shadow)"/>
  <text x="855" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="white">🎓 Academics</text>
  <text x="855" y="360" text-anchor="middle" font-size="9" fill="#ddd6fe">/academics</text>
  <text x="855" y="372" text-anchor="middle" font-size="9" fill="#a78bfa">Admin Only</text>

  <!-- SMS Log (Admin only) -->
  <rect x="970" y="322" width="150" height="54" rx="8" fill="url(#adminGrad)" filter="url(#shadow)"/>
  <text x="1045" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="white">💬 SMS Log</text>
  <text x="1045" y="360" text-anchor="middle" font-size="9" fill="#ddd6fe">/sms-log</text>
  <text x="1045" y="372" text-anchor="middle" font-size="9" fill="#a78bfa">Admin Only</text>

  <!-- Face Registration -->
  <rect x="1160" y="322" width="150" height="54" rx="8" fill="url(#l2Grad)" filter="url(#shadow)"/>
  <text x="1235" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="white">📸 Face Reg.</text>
  <text x="1235" y="358" text-anchor="middle" font-size="9" fill="#cffafe">/face-registration</text>
  <text x="1235" y="372" text-anchor="middle" font-size="9" fill="#cffafe">Admin + Teacher</text>

