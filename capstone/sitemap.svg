  <!-- Gate Log children -->
  <line x1="95" y1="376" x2="95" y2="416" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="418" width="150" height="44" rx="6" fill="url(#leafGrad)" filter="url(#shadow)"/>
  <text x="95" y="436" text-anchor="middle" font-size="10" font-weight="600" fill="white">Live Camera Feed</text>
  <text x="95" y="450" text-anchor="middle" font-size="9" fill="#99f6e4">Real-time Events</text>

  <!-- Classroom children -->
  <line x1="285" y1="376" x2="285" y2="416" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="418" width="150" height="44" rx="6" fill="url(#leafGrad)" filter="url(#shadow)"/>
  <text x="285" y="436" text-anchor="middle" font-size="10" font-weight="600" fill="white">Attendance Board</text>
  <text x="285" y="450" text-anchor="middle" font-size="9" fill="#99f6e4">Mark / View Records</text>

  <!-- Students children -->
  <line x1="475" y1="376" x2="475" y2="416" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="400" y="418" width="150" height="44" rx="6" fill="url(#leafGrad)" filter="url(#shadow)"/>
  <text x="475" y="436" text-anchor="middle" font-size="10" font-weight="600" fill="white">Student Profile</text>
  <text x="475" y="450" text-anchor="middle" font-size="9" fill="#99f6e4">CRUD + Guardians</text>

